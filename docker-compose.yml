version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: pickit-postgres
    restart: always
    environment:
      POSTGRES_USER: pickit
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: pickit_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: pickit-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
